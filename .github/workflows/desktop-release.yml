name: Desktop release

# Push a tag `desktop-vX.Y.Z` matching apps/desktop's version to build the desktop app's installers
# and publish them as a GitHub release, with that version's section of apps/desktop/CHANGELOG.md
# as its notes.
#
# Two release channels: a plain version (desktop-v0.2.0) is a Stable release; a version with a
# suffix (desktop-v0.2.0-beta.1, -rc.1) is an Unstable one, published as a GitHub pre-release.
# Once a release is published, the `desktop-stable` and `desktop-unstable` branches move to it
# (see the last step). See "Release channels" in docs/notes/desktop-app.md.
#
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
on:
  push:
    tags: ["desktop-v*"]

env:
  CARGO_TERM_COLOR: always
  # the production backend, the same one soniroll.com uses
  NEXT_PUBLIC_CONVEX_URL: https://grandiose-dolphin-564.convex.cloud

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04 # libpipewire 0.3.53+ (see desktop-ci.yml)
          - name: macos-universal
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the app's version
        shell: bash
        run: apps/desktop/scripts/check-version.sh "${GITHUB_REF_NAME#desktop-v}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install WebKitGTK, PipeWire and ALSA headers
        if: runner.os == 'Linux'
        # patchelf: for the AppImage
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libasound2-dev libpipewire-0.3-dev libclang-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --filter "@jam-practice/desktop..."

      # `tauri build` builds the frontend, the app and the installers. The files get stable names:
      # soniroll-desktop-<version>-<platform>.<ext>
      # RPM versions can't hold a suffix like "-beta.1", so Unstable releases have no .rpm.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # no FUSE on the runner
        run: |
          v=${GITHUB_REF_NAME#desktop-v}
          if [[ "$v" == *-* ]]; then bundles=deb,appimage; else bundles=deb,rpm,appimage; fi
          pnpm tauri build --bundles $bundles
          b=src-tauri/target/release/bundle
          p=soniroll-desktop-$v-${{ matrix.name }}
          mkdir -p ../../out
          cp $b/deb/*.deb ../../out/$p.deb
          [[ $bundles != *rpm* ]] || cp $b/rpm/*.rpm ../../out/$p.rpm
          cp $b/appimage/*.AppImage ../../out/$p.AppImage
      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        # ad-hoc signed, not notarized (signingIdentity "-" in tauri.conf.json)
        run: |
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg
          b=src-tauri/target/universal-apple-darwin/release/bundle
          p=soniroll-desktop-${GITHUB_REF_NAME#desktop-v}-${{ matrix.name }}
          mkdir -p ../../out
          cp $b/dmg/*.dmg ../../out/$p.dmg
          ditto -c -k --keepParent "$b/macos/soniroll.app" ../../out/$p.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        # the installer adds the WebView2 runtime if Windows lacks it
        run: |
          pnpm tauri build --bundles nsis
          p=soniroll-desktop-${GITHUB_REF_NAME#desktop-v}-${{ matrix.name }}
          mkdir -p ../../out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe ../../out/$p-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  # Publishes whatever built: a platform that failed is left out (and the run shows red), so one
  # broken platform doesn't hold up the others.
  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # every tag, for moving the channel branches
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from apps/desktop/CHANGELOG.md
        id: notes
        run: |
          ls dist/* >/dev/null 2>&1 || { echo "::error::no platform built"; exit 1; }
          v=${GITHUB_REF_NAME#desktop-v}
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # a suffix (0.2.0-beta.1) is the Unstable channel, published as a pre-release
          if [[ "$v" == *-* ]]; then
            channel="**Channel:** Unstable (a pre-release: newer, less tested)."
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            channel="**Channel:** Stable."
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' apps/desktop/CHANGELOG.md > notes.md
          printf '\n%s\n' "$channel" >> notes.md
          cat >> notes.md <<'EOF'

          ### Installing

          - **Linux:** the `.deb` (Debian, Ubuntu), the `.rpm` (Fedora; Stable releases only) or the `.AppImage` (anywhere; make it executable first). Needs PipeWire.
          - **NixOS:** `nix run github:JackMechem/soniroll/${{ github.ref_name }}`, or follow a channel in your configuration (`github:JackMechem/soniroll/desktop-stable` or `/desktop-unstable`); see the README.
          - **macOS:** the `.dmg`. It isn't notarized: the first time, right-click the app and choose Open (or run `xattr -cr /Applications/soniroll.app`).
          - **Windows:** the `-setup.exe`. SmartScreen may warn that it's unrecognized: choose More info, then Run anyway.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: soniroll desktop ${{ steps.notes.outputs.version }}
          prerelease: ${{ steps.notes.outputs.prerelease }}
          files: dist/*
          body_path: notes.md

      # The release channels are branches pointing at the newest release on each: `desktop-unstable`
      # at the newest of all, `desktop-stable` at the newest without a suffix. A fix to an older
      # line (0.1.7 after 0.2.0) leaves them where they are. Flake inputs follow them; nothing is
      # ever committed to them. (A push made with the workflow's token doesn't start other
      # workflows, and apps/web/vercel.json keeps Vercel from deploying these branches.)
      - name: Move the channel branches
        run: |
          # versionsort.suffix sorts 0.2.0-rc.1 before 0.2.0
          newest() { git -c versionsort.suffix=- tag --list 'desktop-v*' --sort=-v:refname | grep -E "$1" | head -n 1; }
          if [ "$(newest .)" = "$GITHUB_REF_NAME" ]; then
            git push --force origin "$GITHUB_SHA:refs/heads/desktop-unstable"
          fi
          if [ "$(newest '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$')" = "$GITHUB_REF_NAME" ]; then
            git push --force origin "$GITHUB_SHA:refs/heads/desktop-stable"
          fi
