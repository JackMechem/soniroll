name: Desktop CI

# Checks the desktop app (apps/desktop) on Linux, macOS and Windows, and that the Nix package
# builds. The app is made from the website's components, so website and package changes run it too.
on:
  push:
    branches: ["**"]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/desktop-*.yml"
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # the production backend, the same one soniroll.com uses (public: it's in the website's code too)
  NEXT_PUBLIC_CONVEX_URL: https://grandiose-dolphin-564.convex.cloud

jobs:
  frontend:
    name: types, lint, version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@jam-practice/desktop..."
      - run: apps/desktop/scripts/check-version.sh
      - name: Types
        working-directory: apps/desktop
        run: pnpm typecheck
      - name: Lint
        working-directory: apps/desktop
        run: pnpm lint
      - name: Build the frontend
        working-directory: apps/desktop
        run: pnpm vite:build

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install WebKitGTK, PipeWire and ALSA headers
        if: runner.os == 'Linux'
        # ubuntu-24.04: cpal's PipeWire support needs libpipewire 0.3.53 or newer (22.04 has 0.3.48)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libasound2-dev libpipewire-0.3-dev libclang-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      # the Rust side embeds apps/desktop/dist, so it has to exist before cargo runs
      - name: Frontend
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile --filter "@jam-practice/desktop..."
          pnpm vite:build
      - name: Formatting
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Release build (no installers)
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle

  nix:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # what NixOS users install (flake.nix's soniroll-desktop); also catches a stale pnpm hash
      - run: nix build -L .#soniroll-desktop
