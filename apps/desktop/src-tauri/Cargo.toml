[package]
name = "soniroll-desktop"
version = "0.1.2"
description = "soniroll desktop app"
edition = "2021"

[lib]
name = "soniroll_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
rtrb = "0.4"
url = "2"
# A Rust implementation of the Web Audio spec. Every tool's sound graph runs in it (bridge.rs).
web-audio-api = { version = "1.7", default-features = false, features = ["cpal"] }
# The Recorder: MP3 encoding (LAME, built from source by the crate; see recorder.rs)
mp3lame-encoder = "0.2.5"

[dev-dependencies]
# LAME's decoder, so the Recorder's tests can decode what they encode.
mp3lame-sys = { version = "0.1.11", features = ["decoder"] }

[features]
default = ["pipewire"]
# Linux: talk to PipeWire directly instead of through its ALSA plugin (lower, steadier latency).
# Does nothing on macOS and Windows.
pipewire = ["cpal/pipewire", "web-audio-api/cpal-pipewire"]

# The audio graph (reverb convolution, resampling, mp3 decoding) is real DSP: unoptimized, it
# can't keep up with small buffers and crackles. Dependencies are built optimized even in
# `tauri dev`; this crate stays quick to rebuild.
[profile.dev.package."*"]
opt-level = 3
